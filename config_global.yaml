# Global LSTM Training Configuration for Multi-Watershed Experiments
#
# USAGE:
#   python train_global.py --config config_global.yaml --experiment streamflow_global_exp1
#
# This configuration supports training a single model across multiple watersheds and
# forcing periods (e.g., historical, RCP4.5, RCP8.5). Static watershed attributes from
# hspf_CAT_attributes.csv are embedded and concatenated with dynamic meteorological
# sequences during training.

base_global_config: &BASE_GLOBAL_CONFIG
  # Data configuration
  data_dir: "data_processed"
  csv_pattern: "{watershed}_{scenario}_combined.csv"
  static_attributes_file: "data_processed/hspf_CAT_attributes.csv"
  static_attribute_id_col: "characteristic_id"
  static_attribute_value_col: "value"
  static_attribute_model_col: "model"
  window_size: 384          # 16 days of hourly data
  stride: 192 #24                # 8-day step between windows
  target_cols: ["streamflow"]
  feature_cols: ["T2", "DEWPT", "PRECIP", "SWDNB", "WSPD10", "LH"]
  use_static_attributes: true
  scale_features: true
  scale_targets: true
  scale_static_attributes: true
  dataset_splits:
    train:
      - watersheds: ["BlueEarth", "LeSueur", "Watonwan", "KettleRiverModels", "LittleFork", "Zumbro", "SnakeSE"]
        scenarios: ["hist_scaled"]
        start: "1980-01-01 00:00:00"
        end: "2000-12-31 23:00:00"
    val:
      - watersheds: ["BlueEarth", "LeSueur", "Watonwan", "KettleRiverModels", "LittleFork", "Zumbro", "SnakeSE"]
        scenarios: ["hist_scaled"]
        start: "1975-01-01 00:00:00"
        end: "1979-12-31 23:00:00"
    test:
      - watersheds: ["BlueEarth", "LeSueur", "Watonwan", "KettleRiverModels", "LittleFork", "Zumbro", "SnakeSE"]
        scenarios: ["hist_scaled"]
        start: "2001-01-01 00:00:00"
        end: "2005-12-31 23:00:00"

  # Model configuration
  hidden_size: 128
  num_layers: 2
  dropout: 0.25
  static_embedding_dim: 64
  static_embedding_layers: [128, 64]
  static_dropout: 0.1

  # Training configuration
  batch_size: 64
  learning_rate: 5.0e-4
  weight_decay: 1.0e-5
  epochs: 150
  grad_clip_norm: 1.0
  scheduler_type: "ReduceLROnPlateau"
  scheduler_patience: 10
  scheduler_factor: 0.3
  scheduler_min_lr: 1.0e-6
  early_stopping_patience: 20
  early_stopping_min_delta: 1.0e-6

  # Experiment management
  save_dir: "experiments/"
  save_every_n_epochs: 25
  tensorboard_log: true
  seed: 42
  device: "auto"           # Set to "cuda:0", "cuda:1", etc. to pin a specific GPU

default_window_plots: &DEFAULT_WINDOW_PLOTS
  BlueEarth: [0, 1, 2, 3]
  LeSueur: [0, 1, 2, 3]
  Watonwan: [0, 1, 2, 3]
  KettleRiverModels: [0, 1, 2, 3]
  LittleFork: [0, 1, 2, 3]
  Zumbro: [0, 1, 2, 3]
  SnakeSE: [0, 1, 2, 3]

default_timeseries_test_range: &DEFAULT_TIMESERIES_TEST_RANGE
  method: ["latest"]
  start: "2001-01-01 00:00:00"
  end: "2005-12-31 23:00:00"

default_timeseries_train_range: &DEFAULT_TIMESERIES_TRAIN_RANGE
  method: ["latest"]
  start: "1980-01-01 00:00:00"
  end: "2000-12-31 23:00:00"

default_timeseries_valid_range: &DEFAULT_TIMESERIES_VALID_RANGE
  method: ["latest"]
  start: "1975-01-01 00:00:00"
  end: "1979-12-31 23:00:00"

# Flip this alias between *DEFAULT_TIMESERIES_TEST_RANGE, *DEFAULT_TIMESERIES_TRAIN_RANGE,
# and *DEFAULT_TIMESERIES_VALID_RANGE as needed.
default_timeseries_range: &DEFAULT_TIMESERIES_RANGE
  <<: *DEFAULT_TIMESERIES_TEST_RANGE
  # <<: *DEFAULT_TIMESERIES_TRAIN_RANGE
  # <<: *DEFAULT_TIMESERIES_VALID_RANGE

default_experiment: streamflow_global_exp1

streamflow_global_exp1: &STREAMFLOW_GLOBAL_EXP1
  <<: *BASE_GLOBAL_CONFIG
  description: >
    Baseline global LSTM model that jointly learns from BlueEarth, LeSueur,
    Watonwan, and KettleRiverModels watersheds across the historical scenario
    (hist_scaled). Static
    attributes are embedded and concatenated with dynamic inputs at every time step.

streamflow_global_exp1_test:
  <<: *STREAMFLOW_GLOBAL_EXP1
  epochs: 5

streamflow_global_exp1_inference: &streamflow_global_exp1_inference
  <<: *STREAMFLOW_GLOBAL_EXP1
  description: >
    Inference and analysis configuration for streamflow_global_exp1.
    Uses the trained model artifacts to run predictions and post-process them.
  source_experiment: "streamflow_global_exp1"
  checkpoint_files: "best_model.pth" # or "final_model.pth"
  split: ["train", "val", "test"]
  window_plots:
    BlueEarth: [0,1,2,3]
    LeSueur: [0,1,2,3]
    Watonwan: [0,1,2,3]
    KettleRiverModels: [0,1,2,3]
  timeseries_plots:
    KettleRiverModels:
      - method: ["latest", "average"]
        start: "2001-01-01 00:00:00"
        end: "2005-12-31 23:00:00"
    BlueEarth:
      - method: ["latest", "average"]
        start: "2001-01-01 00:00:00"
        end: "2005-12-31 23:00:00"
    Watonwan:
      - method: ["latest", "average"]
        start: "2001-01-01 00:00:00"
        end: "2005-12-31 23:00:00"
    LeSueur:
      - method: ["latest", "average"]
        start: "2001-01-01 00:00:00"
        end: "2005-12-31 23:00:00"
  metrics_output: "analysis_results"

streamflow_global_exp1_inference_train:
  <<: *streamflow_global_exp1_inference
  split: ["train"]
  timeseries_plots:
    KettleRiverModels:
      - method: ["latest", "average"]
        start: "1980-01-01 00:00:00"
        end: "2000-12-31 23:00:00"
    BlueEarth:
      - method: ["latest", "average"]
        start: "1980-01-01 00:00:00"
        end: "2000-12-31 23:00:00"
    Watonwan:
      - method: ["latest", "average"]
        start: "1980-01-01 00:00:00"
        end: "2000-12-31 23:00:00"
    LeSueur:
      - method: ["latest", "average"]
        start: "1980-01-01 00:00:00"
        end: "2000-12-31 23:00:00"

streamflow_global_exp1_inference_val:
  <<: *streamflow_global_exp1_inference
  split: ["val"]
  timeseries_plots:
    KettleRiverModels:
      - method: ["latest", "average"]
        start: "1975-01-01 00:00:00"
        end: "1979-12-31 23:00:00"

streamflow_hmtl_global: &STREAMFLOW_HMTL_GLOBAL
  <<: *BASE_GLOBAL_CONFIG
  description: >
    Hierarchical multi-task global model jointly predicting intermediate
    hydrologic variables and final streamflow across BlueEarth, LeSueur,
    Watonwan, and KettleRiverModels watersheds for hist_scaled scenarios.
  training_strategy: "hmtl_global"
  intermediate_targets: ["PET", "ET", "SUPY", "WYIE", "SNOW", "TWS", "LZS", "AGW"]
  scale_intermediate_targets: true
  loss_weights:
    final: 1.0
    intermediate:
      default: 1.0
      PET: 0.8
      ET: 0.8
  static_embedding_layers: [128, 64]
  static_dropout: 0.1
  device: "cuda:2"

streamflow_hmtl_global_test:
  <<: *STREAMFLOW_HMTL_GLOBAL
  epochs: 3

streamflow_hmtl_global_inference: &STREAMFLOW_HMTL_GLOBAL_INFERENCE
  <<: *STREAMFLOW_HMTL_GLOBAL
  description: >
    Inference configuration for streamflow_hmtl_global. Runs predictions for
    train/val/test splits and saves windowed plus reconstructed series with
    both intermediate and final targets.
  source_experiment: "streamflow_hmtl_global"
  checkpoint_files:
    best: "best_model.pth"
    final: "final_model.pth"
  checkpoint_choice: "best"
  split: ["test"]
  reconstruction_methods: ["latest"]
  window_file_format: "csv"
  results_subdir: "test_results"

streamflow_hmtl_global_inference_val:
  <<: *STREAMFLOW_HMTL_GLOBAL_INFERENCE
  split: ["val"]
  results_subdir: "val_results"

streamflow_hmtl_global_inference_train:
  <<: *STREAMFLOW_HMTL_GLOBAL_INFERENCE
  split: ["train"]
  results_subdir: "train_results"


streamflow_hmtl_global_analysis:
  <<: *STREAMFLOW_HMTL_GLOBAL_INFERENCE
  description: >
    Analysis template for hierarchical global inference outputs.
  source_experiment: "streamflow_hmtl_global"
  metrics_output: "analysis_results"
  train: ['KettleRiverModels', 'BlueEarth', 'Watonwan', 'LeSueur', 'LittleFork', 'Zumbro', 'SnakeSE']
  val: ['KettleRiverModels', 'BlueEarth', 'Watonwan', 'LeSueur', 'LittleFork', 'Zumbro', 'SnakeSE']
  test: ['KettleRiverModels', 'BlueEarth', 'Watonwan', 'LeSueur', 'LittleFork', 'Zumbro', 'SnakeSE']
  method: "latest"
  window_plots:
    train: [0, 3, 5]
    val: [0, 3, 5]
    test: [0, 3, 5]

daily_global_PET: &daily_global_PET
  <<: *BASE_GLOBAL_CONFIG
  description: >
    Daily model for intermediate variables using daily aggregated inputs.
  csv_pattern: "{watershed}_{scenario}_combined_daily.csv"
  window_size: 182
  stride: 91
  target_cols: ["PET"]
