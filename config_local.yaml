# Global LSTM Training Configuration for Multi-Watershed Experiments
#
# USAGE:
#   python train_global.py --config config_global.yaml --experiment streamflow_global_exp1
#
# This configuration supports training a single model across multiple watersheds and
# forcing periods (e.g., historical, RCP4.5, RCP8.5). Static watershed attributes from
# hspf_CAT_attributes.csv are embedded and concatenated with dynamic meteorological
# sequences during training.

base_kettle_river_config: &BASE_KETTLE_RIVER_CONFIG
  # Data configuration
  data_dir: "data_processed"
  csv_pattern: "{watershed}_{scenario}_combined.csv"
  static_attributes_file: "data_processed/hspf_CAT_attributes.csv"
  static_attribute_id_col: "characteristic_id"
  static_attribute_value_col: "value"
  static_attribute_model_col: "model"
  window_size: 360          # 15 days of hourly data
  stride: 24                # 1-day step between windows
  target_cols: ["streamflow"]
  feature_cols: ["T2", "DEWPT", "PRECIP", "SWDNB", "WSPD10", "LH"]
  use_static_attributes: true
  scale_features: true
  scale_targets: true
  scale_static_attributes: true
  dataset_splits:
    train:
      - watersheds: ["KettleRiverModels"]
        scenarios: ["hist_scaled"]
        start: "1980-01-01 00:00:00"
        end: "2000-12-31 23:00:00"
    val:
      - watersheds: ["KettleRiverModels"]
        scenarios: ["hist_scaled"]
        start: "1975-01-01 00:00:00"
        end: "1979-12-31 23:00:00"
    test:
      - watersheds: ["KettleRiverModels"]
        scenarios: ["hist_scaled"]
        start: "2001-01-01 00:00:00"
        end: "2005-12-31 23:00:00"

  # Model configuration
  hidden_size: 128
  num_layers: 2
  dropout: 0.25
  static_embedding_dim: 64
  static_embedding_layers: [128, 64]
  static_dropout: 0.1

  # Training configuration
  batch_size: 64
  learning_rate: 5.0e-4
  weight_decay: 1.0e-5
  epochs: 150
  grad_clip_norm: 1.0
  scheduler_type: "ReduceLROnPlateau"
  scheduler_patience: 10
  scheduler_factor: 0.3
  scheduler_min_lr: 1.0e-6
  early_stopping_patience: 20
  early_stopping_min_delta: 1.0e-6

  # Experiment management
  save_dir: "experiments/kettle_river_models"
  save_every_n_epochs: 25
  tensorboard_log: true
  seed: 42
  device: "auto"           # Set to "cuda:0", "cuda:1", etc. to pin a specific GPU

default_experiment: streamflow_kettle_river_exp1

streamflow_kettle_river_exp1: &STREAMFLOW_KETTLE_RIVER_EXP1
  <<: *BASE_KETTLE_RIVER_CONFIG
  description: >
    Baseline local LSTM model that jointly learns from KettleRiverModels watershed
    across the historical scenario (hist_scaled). Static
    attributes are embedded and concatenated with dynamic inputs at every time step.

streamflow_kettle_river_exp1_test:
  <<: *STREAMFLOW_KETTLE_RIVER_EXP1
  epochs: 5

streamflow_kettle_river_exp1_inference: &streamflow_kettle_river_exp1_inference
  <<: *STREAMFLOW_KETTLE_RIVER_EXP1
  description: >
    Inference and analysis configuration for streamflow_kettle_river_exp1.
    Uses the trained model artifacts to run predictions and post-process them.
  source_experiment: "streamflow_kettle_river_exp1"
  checkpoint_files: "best_model.pth" # or "final_model.pth"
  split: ["train", "val", "test"]
  window_plots:
    KettleRiverModels: [0,1,2,3]
  timeseries_plots:
    KettleRiverModels:
      - method: ["latest", "average"]
        start: "2001-01-01 00:00:00"
        end: "2005-12-31 23:00:00"
  metrics_output: "analysis_results"

streamflow_kettle_river_exp1_inference_train:
  <<: *streamflow_kettle_river_exp1_inference
  split: ["train"]
  timeseries_plots:
    KettleRiverModels:
      - method: ["latest", "average"]
        start: "1980-01-01 00:00:00"
        end: "2000-12-31 23:00:00"

streamflow_kettle_river_exp1_inference_val:
  <<: *streamflow_kettle_river_exp1_inference
  split: ["val"]
  timeseries_plots:
    KettleRiverModels:
      - method: ["latest", "average"]
        start: "1975-01-01 00:00:00"
        end: "1979-12-31 23:00:00"

# Hierarchical Multi-Task Learning Configuration for Kettle River Models

streamflow_hmtl_kettle_river: &STREAMFLOW_HMTL_KETTLE_RIVER
  <<: *BASE_KETTLE_RIVER_CONFIG
  description: >
    Hierarchical multi-task kettle_river model jointly predicting intermediate
    hydrologic variables and final streamflow across KettleRiverModels watersheds for hist_scaled scenarios.
  training_strategy: "hmtl_kettle_river"
  intermediate_targets: ["PET", "ET", "SUPY", "WYIE", "SNOW", "TWS", "LZS", "AGW"]
  scale_intermediate_targets: true
  loss_weights:
    final: 1.0
    intermediate:
      default: 1.0
      PET: 0.8
      ET: 0.8
  static_embedding_layers: [128, 64]
  static_dropout: 0.1
  device: "cuda:1"

streamflow_hmtl_kettle_river_inference: &STREAMFLOW_HMTL_KETTLE_RIVER_INFERENCE
  <<: *STREAMFLOW_HMTL_KETTLE_RIVER
  description: >
    Inference configuration for streamflow_hmtl_kettle_river. Runs predictions for
    train/val/test splits and saves windowed plus reconstructed series with
    both intermediate and final targets.
  source_experiment: "streamflow_hmtl_kettle_river"
  checkpoint_files:
    best: "best_model.pth"
    final: "final_model.pth"
  checkpoint_choice: "best"
  split: ["test"]
  reconstruction_methods: ["latest"]
  window_file_format: "csv"
  results_subdir: "test_results"

streamflow_hmtl_kettle_river_inference_val:
  <<: *STREAMFLOW_HMTL_KETTLE_RIVER_INFERENCE
  split: ["val"]
  results_subdir: "val_results"

streamflow_hmtl_kettle_river_inference_train:
  <<: *STREAMFLOW_HMTL_KETTLE_RIVER_INFERENCE
  split: ["train"]
  results_subdir: "train_results"


streamflow_hmtl_kettle_river_analysis:
  <<: *STREAMFLOW_HMTL_KETTLE_RIVER_INFERENCE
  description: >
    Analysis template for hierarchical kettle_river inference outputs.
  source_experiment: "streamflow_hmtl_kettle_river"
  metrics_output: "analysis_results"
  train: ['KettleRiverModels']
  val: ['KettleRiverModels']
  test: ['KettleRiverModels']
  method: "latest"
  window_plots:
    train: [0, 3, 5]
    val: [0, 3, 5]
    test: [0, 3, 5]


streamflow_hmtl_kettle_river_state_hourly: &STREAMFLOW_HMTL_KETTLE_RIVER_STATE_HOURLY
  <<: *STREAMFLOW_HMTL_KETTLE_RIVER
  description: >
    Hierarchical multi-task kettle_river model with hourly static state inputs.
  csv_pattern: "{watershed}_{scenario}_combined_hourly.csv"

streamflow_hmtl_kettle_river_state_hourly_inference: &STREAMFLOW_HMTL_KETTLE_RIVER_STATE_HOURLY_INFERENCE
  <<: *STREAMFLOW_HMTL_KETTLE_RIVER_STATE_HOURLY
  description: >
    Inference configuration for streamflow_hmtl_kettle_river_state_hourly. Runs predictions for
    train/val/test splits and saves windowed plus reconstructed series with
    both intermediate and final targets.
  source_experiment: "streamflow_hmtl_kettle_river_state_hourly"
  checkpoint_files:
    best: "best_model.pth"
    final: "final_model.pth"
  checkpoint_choice: "best"
  split: ["test"]
  reconstruction_methods: ["latest"]
  window_file_format: "csv"
  results_subdir: "test_results"

streamflow_hmtl_kettle_river_state_hourly_inference_val:
  <<: *STREAMFLOW_HMTL_KETTLE_RIVER_STATE_HOURLY_INFERENCE
  split: ["val"]
  results_subdir: "val_results"

streamflow_hmtl_kettle_river_state_hourly_inference_train:
  <<: *STREAMFLOW_HMTL_KETTLE_RIVER_STATE_HOURLY_INFERENCE
  split: ["train"]
  results_subdir: "train_results"

streamflow_hmtl_kettle_river_state_hourly_analysis:
  <<: *STREAMFLOW_HMTL_KETTLE_RIVER_STATE_HOURLY_INFERENCE
  description: >
    Analysis template for hierarchical kettle_river_state_hourly inference outputs.
  source_experiment: "streamflow_hmtl_kettle_river_state_hourly"
  metrics_output: "analysis_results"
  train: ['KettleRiverModels']
  val: ['KettleRiverModels']
  test: ['KettleRiverModels']
  method: "latest"
  window_plots:
    train: [0, 3, 5]
    val: [0, 3, 5]
    test: [0, 3, 5] 